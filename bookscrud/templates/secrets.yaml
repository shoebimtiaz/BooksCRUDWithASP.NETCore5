{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bookscrud.fullname" . }}-secrets
  labels:
    {{- include "bookscrud.labels" . | nindent 4 }}
type: Opaque
stringData:
  sql-password: {{ .Values.secrets.sqlPassword | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
{{- end }}
