{{- if .Values.sqlserver.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bookscrud.fullname" . }}-sqlserver
  labels:
    {{- include "bookscrud.labels" . | nindent 4 }}
    app.kubernetes.io/component: sqlserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bookscrud.name" . }}
      app.kubernetes.io/component: sqlserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bookscrud.name" . }}
        app.kubernetes.io/component: sqlserver
    spec:
      containers:
        - name: sqlserver
          image: "{{ .Values.sqlserver.image.repository }}:{{ .Values.sqlserver.image.tag }}"
          imagePullPolicy: {{ .Values.sqlserver.image.pullPolicy }}
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bookscrud.fullname" . }}-secrets
                  key: sql-password
          ports:
            - containerPort: 1433
          volumeMounts:
            - name: mssql-data
              mountPath: /var/opt/mssql
      volumes:
        - name: mssql-data
          persistentVolumeClaim:
            claimName: {{ include "bookscrud.fullname" . }}-sqlserver-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bookscrud.fullname" . }}-sqlserver-pvc
  labels:
    {{- include "bookscrud.labels" . | nindent 4 }}
    app.kubernetes.io/component: sqlserver
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.sqlserver.persistence.size }}
  storageClassName: {{ .Values.sqlserver.persistence.storageClass | quote }}
{{- end }}
